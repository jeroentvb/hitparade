  <line x1="12" y1="12" x2="18" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="12" x2="12" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="25" x2="31" y2="31" stroke="white" stroke-width="2" stroke-linecap="round"/>
