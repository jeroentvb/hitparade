  <rect x="36" y="36" width="10" height="10" rx="2" fill="#d97706"/>
  <rect x="49" y="36" width="10" height="10" rx="2" fill="#7c3aed"/>
  <rect x="62" y="36" width="10" height="10" rx="2" fill="#65a30d"/>
  <!-- Row 3 -->
  <rect x="10" y="49" width="10" height="10" rx="2" fill="#d97706"/>
  <rect x="23" y="49" width="10" height="10" rx="2" fill="#65a30d"/>
  <rect x="36" y="49" width="10" height="10" rx="2" fill="#7c3aed"/>
  <rect x="49" y="49" width="10" height="10" rx="2" fill="#db2777"/>
  <rect x="62" y="49" width="10" height="10" rx="2" fill="#0891b2"/>
  <!-- Row 4 -->
