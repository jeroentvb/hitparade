<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- 5x5 grid of colored cells -->
  <!-- Row 0 -->
  <rect x="10" y="10" width="18" height="18" rx="3" fill="#db2777"/>
  <rect x="32" y="10" width="18" height="18" rx="3" fill="#d97706"/>
  <rect x="54" y="10" width="18" height="18" rx="3" fill="#0891b2"/>
  <rect x="76" y="10" width="18" height="18" rx="3" fill="#65a30d"/>
  <rect x="98" y="10" width="18" height="18" rx="3" fill="#7c3aed"/>
  <!-- Row 1 -->
  <rect x="10" y="32" width="18" height="18" rx="3" fill="#65a30d"/>
  <rect x="32" y="32" width="18" height="18" rx="3" fill="#7c3aed"/>
  <rect x="54" y="32" width="18" height="18" rx="3" fill="#db2777"/>
  <rect x="76" y="32" width="18" height="18" rx="3" fill="#0891b2"/>
  <rect x="98" y="32" width="18" height="18" rx="3" fill="#d97706"/>
  <!-- Row 2 -->
  <rect x="10" y="54" width="18" height="18" rx="3" fill="#0891b2"/>
  <rect x="32" y="54" width="18" height="18" rx="3" fill="#db2777"/>
  <rect x="54" y="54" width="18" height="18" rx="3" fill="#d97706"/>
  <rect x="76" y="54" width="18" height="18" rx="3" fill="#7c3aed"/>
  <rect x="98" y="54" width="18" height="18" rx="3" fill="#65a30d"/>
  <!-- Row 3 -->
  <rect x="10" y="76" width="18" height="18" rx="3" fill="#d97706"/>
  <rect x="32" y="76" width="18" height="18" rx="3" fill="#65a30d"/>
  <rect x="54" y="76" width="18" height="18" rx="3" fill="#7c3aed"/>
  <rect x="76" y="76" width="18" height="18" rx="3" fill="#db2777"/>
  <rect x="98" y="76" width="18" height="18" rx="3" fill="#0891b2"/>
  <!-- Row 4 -->
  <rect x="10" y="98" width="18" height="18" rx="3" fill="#7c3aed"/>
  <rect x="32" y="98" width="18" height="18" rx="3" fill="#0891b2"/>
  <rect x="54" y="98" width="18" height="18" rx="3" fill="#65a30d"/>
  <rect x="76" y="98" width="18" height="18" rx="3" fill="#d97706"/>
  <rect x="98" y="98" width="18" height="18" rx="3" fill="#db2777"/>
  <!-- Cross marks on some cells (diagonal bingo!) -->
  <!-- (0,0) -->
  <line x1="13" y1="13" x2="25" y2="25" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="13" x2="13" y2="25" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- (1,1) -->
  <line x1="35" y1="35" x2="47" y2="47" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="35" x2="35" y2="47" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- (2,2) -->
  <line x1="57" y1="57" x2="69" y2="69" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="69" y1="57" x2="57" y2="69" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- (3,3) -->
  <line x1="79" y1="79" x2="91" y2="91" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="91" y1="79" x2="79" y2="91" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- (4,4) -->
  <line x1="101" y1="101" x2="113" y2="113" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="113" y1="101" x2="101" y2="113" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
